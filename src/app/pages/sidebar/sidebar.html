<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">T</div>
    <span>Team FT</span>
  </div>
<div
  class="sidebar-notification-bell"
  *ngIf="!authService.hasRole('ROLE_ADMIN')">

  <app-notification-bell></app-notification-bell>
</div>
  
  <nav class="sidebar-nav"
       *ngIf="!authService.hasRole('ROLE_MEMBER')">

    <a *ngIf="!authService.hasRole('ROLE_MANAGER')" routerLink="/dashboard"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }">
      <span class="menu-icon">▦</span>
      <span>Tổng quan</span>
    </a>

    <a *ngIf="!authService.hasRole('ROLE_ADMIN')" routerLink="/manager"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }">
      <span class="menu-icon">▦</span>
      <span>Tổng quan Manager</span>
    </a>
    
    <a *ngIf="!authService.hasRole('ROLE_MANAGER')" routerLink="/task-management" routerLinkActive="active">
      <span class="menu-icon">☷</span>
      <span>Quản lý Task</span>
    </a>

    <a *ngIf="!authService.hasRole('ROLE_ADMIN')" routerLink="/task-manager" routerLinkActive="active">
      <span class="menu-icon">☷</span>
      <span>Tạo Task</span>
    </a>

   <a
  *ngIf="!authService.hasRole('ROLE_ADMIN')"
  routerLink="/tasks"
  routerLinkActive="active">
  <span class="menu-icon">⇄</span>
  <span>Phân công công việc</span>
</a>

    <a *ngIf="!authService.hasRole('ROLE_MANAGER')" routerLink="/projects" routerLinkActive="active">
      <span class="menu-icon">▤</span>
      <span>Project</span>
    </a>

    <a *ngIf="!authService.hasRole('ROLE_MANAGER')" routerLink="/customers" routerLinkActive="active">
      <span class="menu-icon">◎</span>
      <span>Khách hàng</span>
    </a>

    <a *ngIf="!authService.hasRole('ROLE_MANAGER')" routerLink="/users" routerLinkActive="active">
      <span class="menu-icon">♙</span>
      <span>Thành viên</span>
    </a>
    <a *ngIf="!authService.hasRole('ROLE_ADMIN')" routerLink="/team-worklog" routerLinkActive="active" 
    class="sidebar-menu-item">
      <span class="menu-icon">🕒</span>
      <span>Worklog nhóm</span>
</a>

  </nav>

  <div class="sidebar-bottom">
    <div class="profile-avatar">
      {{ authService.getUsername()?.charAt(0)?.toUpperCase() || 'U' }}
    </div>

    <div class="profile-info">
      <span *ngIf="authService.user$ | async as user">
        Xin chào, {{ user.username }}
      </span>

      <span *ngIf="authService.hasRole('ROLE_ADMIN')">
        Administrator
      </span>

      <span *ngIf="authService.hasRole('ROLE_MANAGER')">
        MANAGER
      </span>

      <span *ngIf="authService.hasRole('ROLE_MEMBER')">
        MEMBER
      </span>
    </div>

    <button
      class="logout-button"
      type="button"
      (click)="logout()"
      title="Đăng xuất"
      aria-label="Đăng xuất">
      ↪
    </button>
  </div>
</aside>
